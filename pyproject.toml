[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gppaf"
version = "1.4.5"
description = "Research source code for the GPPAF algorithms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.11,<2", "torch>=2.3,<3", "shapely>=2,<3", "scikit-learn>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["gppaf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
